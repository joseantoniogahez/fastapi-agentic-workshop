[project]
name = "fastapi-agentic-workshop"
version = "0.1.0"
description = "Proyecto base para experimentar con FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.142.2",
    "sqlalchemy==2.1.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
