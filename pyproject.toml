[project]
name = "fastapi-agentic-workshop"
version = "0.1.0"
description = "Proyecto base para experimentar con FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.142.2",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
    "sqlalchemy==2.1.3",
]

[dependency-groups]
dev = ["httpx2>=1.0", "pytest>=9.1"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
